name: Release

# Manually trigger a release from the Actions tab.
# Builds dist/, commits it, creates an immutable tag (v1.2.3),
# and moves the floating major tag (v1) to the same commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 — no leading v)"
        required: true

jobs:
  release:
    name: Build and tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build dist
        run: npm run build

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "chore: build dist for v${{ github.event.inputs.version }}"

      - name: Create version tag
        run: |
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Move floating major tag
        run: |
          MAJOR=$(echo "${{ github.event.inputs.version }}" | cut -d. -f1)
          git tag -f "v${MAJOR}"
          git push origin "v${MAJOR}" --force

      - name: Push commits
        run: git push origin main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.event.inputs.version }}" \
            --title "v${{ github.event.inputs.version }}" \
            --generate-notes
