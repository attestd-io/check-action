name: "Attestd Dependency Check"
description: "Check a dependency or whole lockfile against the Attestd security risk API and fail the workflow if risk meets a configured threshold."
author: "Attestd"

branding:
  icon: shield
  color: red

inputs:
  api_key:
    description: "Attestd API key (starts with atst_). Store as a repository secret."
    required: true
  product:
    description: "Product slug to check (e.g. nginx, postgresql, openssh). Mutually exclusive with lockfile."
    required: false
  version:
    description: "Version string to check (e.g. 1.20.0, 9.2p1, 2.17.1). Required with product."
    required: false
  lockfile:
    description: "Path to requirements.txt or package-lock.json (v2/v3). Mutually exclusive with product/version."
    required: false
  fail_on:
    description: "Minimum risk state that fails the step. Options: critical, high, elevated, any, never. Default: high."
    required: false
    default: "high"
  fail_on_provenance_missing:
    description: "If true, fail when supply_chain.provenance is false (package has a provenance baseline but this version lacks attestation). Default: false."
    required: false
    default: "false"
  max_packages:
    description: "Safety cap for lockfile scans. Fails before any API calls if the parsed package count exceeds this. Default: 2000."
    required: false
    default: "2000"
  results_file:
    description: "Path to write the lockfile scan JSON summary. Default: attestd-scan-results.json."
    required: false
    default: "attestd-scan-results.json"
  base_url:
    description: "Attestd API base URL. Do not override unless testing against a local instance."
    required: false
    default: "https://api.attestd.io"

outputs:
  risk_state:
    description: "Single-check: risk state returned by Attestd. Empty in lockfile mode."
  actively_exploited:
    description: "Single-check: true if on the CISA KEV list. Empty in lockfile mode."
  fixed_version:
    description: "Single-check: earliest safe version, or empty. Empty in lockfile mode."
  cve_ids:
    description: "Single-check: space-separated CVE IDs. Empty in lockfile mode."
  supported:
    description: "Single-check: true if the product is in Attestd coverage. Empty in lockfile mode."
  compromised:
    description: "Single-check: true if flagged as a supply-chain compromise. Empty in lockfile mode."
  provenance:
    description: "Single-check: true/false/empty provenance tri-state. Empty in lockfile mode."
  typosquat:
    description: "Single-check: true if the package name resembles a known package. Empty in lockfile mode."
  packages_scanned:
    description: "Lockfile mode: number of packages checked via the API."
  packages_flagged:
    description: "Lockfile mode: number of packages that were compromised or high/critical (or failed gates)."
  packages_unsupported:
    description: "Lockfile mode: number of packages outside Attestd coverage."
  highest_risk_state:
    description: "Lockfile mode: highest risk_state among supported packages."
  results_path:
    description: "Lockfile mode: path to the written JSON summary file."

runs:
  using: "node20"
  main: "dist/index.js"
