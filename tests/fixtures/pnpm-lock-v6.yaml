  /express@4.18.2:
    resolution: {integrity: sha512-test}
    dependencies:
      accepts: 1.3.8
      debug: 2.6.9
      qs: 6.11.0
    dev: false

  /debug@2.6.9:
    resolution: {integrity: sha512-test}
    dev: false

  /accepts@1.3.8:
    resolution: {integrity: sha512-test}
    dev: false

  /qs@6.11.0:
    resolution: {integrity: sha512-test}
    dev: false

